<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"/>
    <title>Contato</title>
</head>


<body style="font-family: Poppins">

    <nav>
        <a href="../index.html">
            <p>TripWay</p>
        </a>

        <ul>
            <li><a href="../index.html">Home</a></li>
            <li><a href="../index.html">Pacotes</a></li>
            <li><a href="../index.html">Contato</a></li>
        </ul>
    </nav>
    
    <main>
        <h1>Contato</h1>

        <section>

            <h3>Qual será o seu próximo destino?</h3>

            <form action="#"> 

                <label for="nome">Nome</label><br>
                <input type="text" id="nome" name="nome" placeholder="João Silva" > 

                <br><br>

                <label for="email">E-mail</label><br>
                <input type="email" id="email" name="email">

                <br><br>

                <label for="destino">Destino de interesse</label><br>
                <select id="destino" name="destino">
                    <option value="emptystate"></option>
                    <option value="forte">Praia do forte</option>
                    <option value="chapada">Chapada Diamantina</option>
                    <option value="salvador">Salvador</option>
                </select>

                <br><br>

                <label for="quantidade">Quantidade de pessoas</label><br>
                <input type="number" id="quantidade" name="quantidade" min="1" placeholder="Selecione a quantidade">

                <br><br>

                <label for="mensagem">Mensagem</label> <br>
                <textarea
                id="mensagem"
                name="mensagem"
                rows="5"
                cols="30"
                placeholder="Digite sua mensagem aqui"></textarea>

                <br><br>

                <button type="submit">Enviar</button>

            </form>
  
        </section>

        <br><br>
        
        <footer>©️ 2026 TripWay. Todos os direitos reservados.</footer>

    </main>

</body>

</html>
